<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8"/>
    <title>GitHub Jira integration plugin for Chrome</title>
    <style>
        body {
            box-sizing: border-box;
            min-width: 380px;
            margin: 0;
            padding: 20px 24px 24px;
            font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        }

        h3 {
            margin: 20px 0 12px;
        }

        label {
            display: block;
            margin-bottom: 6px;
        }

        input[type="url"] {
            box-sizing: border-box;
            width: 100%;
            padding: 6px 8px;
            font: inherit;
        }

        .field {
            margin-bottom: 20px;
        }

        .hint {
            margin-top: 6px;
            color: #57606a;
            font-size: 12px;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 24px;
        }

        button {
            padding: 6px 14px;
            font: inherit;
        }

        #status {
            margin: 16px 0 0;
            padding: 8px 12px;
            border-radius: 6px;
            background-color: rgb(57, 255, 59);
            font-size: 14px;
            font-weight: 600;
        }
    </style>
</head>

<body>
<a href="https://github.com/RobQuistNL/chrome-github-jira">Source / GitHub / Issues</a>

<h3>Settings</h3>

<div class="field">
    <label for="jiraUrl">Jira URL</label>
    <input type="url" id="jiraUrl" placeholder="your-site.atlassian.net"/>
    <p class="hint">Without scheme or slashes, e.g. <code>your-site.atlassian.net</code></p>
</div>

<div class="actions">
    <button id="save">Save</button>
    <button id="clear">Clear storage</button>
</div>

<p id="status" style="display:none;">Options saved.</p>

<script type="text/javascript" src="options.js"></script>
</body>
</html>
